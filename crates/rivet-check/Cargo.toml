[package]
name = "rivet-check"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
memmap2 = "0.9.12"
nix = { version = "0.31.3", features = ["ptrace", "process", "signal", "mman", "feature"] }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
fastrand = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess = "1.2.3"
tempfile = "3"
strum = { version = "0.28.0", features = ["derive"] }
rivet-import = { path = "../rivet-import" }
