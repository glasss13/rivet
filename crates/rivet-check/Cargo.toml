[package]
name = "rivet-check"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", features = ["ptrace", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess = "1.2.3"
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "intel"] }
